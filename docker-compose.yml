version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kase_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kase_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-0000}"
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - kase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kase_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKER_IMAGE:-ghcr.io/kabarbekn/yesimde-stocks:latest}
    build:
      context: ./kase-stock-exchange-parser
      dockerfile: Dockerfile
    container_name: kase_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/kase_db
      DB_R2DBC_URL: r2dbc:postgresql://postgres:5432/kase_db
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD:-0000}"
      PORT: 8080
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-KaseRadarBot}"
      TELEGRAM_BOT_ENABLED: "${TELEGRAM_BOT_ENABLED:-true}"
    ports:
      - "${APP_PORT:-8088}:8080"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=kase"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: kase_watchtower
    restart: unless-stopped
    environment:
      # Изоляция: обновляем только контейнеры из скоупа kase
      WATCHTOWER_SCOPE: "kase"
      # Удалять старые образы после обновления (экономия места на диске)
      WATCHTOWER_CLEANUP: "true"
      # Обновлять ТОЛЬКО контейнеры с меткой com.centurylinklabs.watchtower.enable=true (базу данных postgres не трогаем!)
      WATCHTOWER_LABEL_ENABLE: "true"
      # Интервал проверки новых образов в секундах (120 сек = 2 минуты)
      WATCHTOWER_POLL_INTERVAL: "120"
      WATCHTOWER_TIMEOUT: "30s"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Если реестр GHCR приватный, раскомментируйте строку ниже после `docker login ghcr.io`:
      # - ~/.docker/config.json:/config.json:ro

volumes:
  kase_pgdata:
