name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================
  # 1. CI: Build & Test (Java 21 & Maven)
  # =========================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x ./kase-stock-exchange-parser/mvnw

      - name: Run Maven Tests
        working-directory: ./kase-stock-exchange-parser
        run: ./mvnw clean test -B

  # =========================================================
  # 2. CD: Build & Publish Docker Image to GHCR
  # =========================================================
  docker:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./kase-stock-exchange-parser
          file: ./kase-stock-exchange-parser/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # 3. CD: Deploy to Remote Server via SSH (Optional)
  # =========================================================
  deploy:
    name: Deploy to Server
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Check if server deployment is configured
        id: check_deploy
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Server host is configured. Proceeding with deployment."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "SERVER_HOST secret is not set. Skipping SSH deployment."
          fi

      - name: Deploy via SSH
        if: steps.check_deploy.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH || '/opt/yesimde-stocks' }}"
            echo "Navigating to deploy path: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Pull latest git changes if git repository exists on server
            if [ -d ".git" ]; then
              echo "Pulling latest docker-compose configuration..."
              git pull origin master || true
            fi

            # Pull newly built image from GHCR
            echo "Pulling latest Docker image from GHCR..."
            docker compose pull app

            # Restart services with zero downtime
            echo "Restarting containers..."
            docker compose up -d --remove-orphans

            # Clean up old unused images to save disk space
            echo "Cleaning unused Docker images..."
            docker image prune -f
            echo "Deployment completed successfully!"
